[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "triemap"
version = "0.1.0"
description = "A lightweight trie-based mapping for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

authors = [
    { name = "Wesley Wilkes" }
]

keywords = [
    "trie",
    "data-structures",
]

classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/wpwilkes/triemap"
Repository = "https://github.com/wpwilkes/triemap"
Issues = "https://github.com/wpwilkes/triemap/issues"

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "twine",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triemap = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["triemap"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
pretty = true
show_error_codes = true
